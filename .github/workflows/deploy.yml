name: Deploy to Production

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Cargar nvm para tener npm/node/pm2 disponibles
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/dev/servidor-discord-dbd

            echo "📥 Obteniendo últimos cambios..."
            git pull

            echo "📦 Instalando dependencias..."
            npm install

            echo "🏗️ Construyendo aplicaciones..."
            npx nx run-many -t build

            echo "📋 Copiando cliente al servidor..."
            rm -rf apps/dashboard/server/dist-client
            cp -r apps/dashboard/client/dist apps/dashboard/server/dist-client

            echo "🔄 Recargando servicios PM2..."
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js

            echo "📊 Estado actual:"
            pm2 status

            echo "✅ Deploy completado!"
